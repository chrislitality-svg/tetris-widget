<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline';">
  <title>俄罗斯方块</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="widget-container">
    <div class="top-actions">
      <button class="icon-btn" id="aiBtn" title="AI 自动运行">AI</button>
      <button class="icon-btn" id="sizeBtn" title="切换尺寸">⊡</button>
      <button class="icon-btn" id="speedBtn" title="切换速度">⚡</button>
      <button class="icon-btn" id="playBtn" title="开始/暂停">▶</button>
      <button class="icon-btn" id="restartBtn" title="重新开始">↻</button>
      <button class="icon-btn" id="moyuBtn" title="摸鱼模式：配色贴近 Claude Desktop，贴顶置顶显示，小键盘 1 瞬间隐藏">🐟</button>
      <button class="icon-btn" id="effectBtn" title="特效模式：程序生成音乐 + 逐关配色/调式同步">🎵</button>
      <button class="icon-btn" id="settingsBtn" title="设置">⚙</button>
      <button class="icon-btn close-btn" id="closeBtn" title="退出">×</button>
    </div>

    <div class="game-area">
      <div class="canvas-wrap">
        <canvas id="gameCanvas"></canvas>
      </div>
      <div class="side-panel">
        <div class="hold-label">暂存</div>
        <div class="hold-wrap">
          <canvas id="holdCanvas"></canvas>
        </div>
        <div class="next-label">下一个</div>
        <div class="next-wrap">
          <canvas id="nextCanvas"></canvas>
        </div>
        <div class="info-box">
          <div class="info-row"><span class="info-key">模式</span><span class="info-val" id="modeText">马拉松</span></div>
          <div class="info-row"><span class="info-key">分数</span><span class="info-val" id="scoreText">0</span></div>
          <div class="info-row"><span class="info-key">等级</span><span class="info-val" id="levelText">1</span></div>
          <div class="info-row"><span class="info-key">行数</span><span class="info-val" id="linesText">0</span></div>
          <div class="info-row"><span class="info-key" id="timeLabel">时间</span><span class="info-val" id="timeText">—</span></div>
          <div class="info-row"><span class="info-key" id="recordLabel">最佳</span><span class="info-val" id="recordText">0</span></div>
        </div>
      </div>
    </div>

    <div class="settings-panel hidden" id="settingsPanel">
      <div class="sp-head"><span>设置</span><button class="icon-btn" id="spClose" title="关闭">×</button></div>
      <div class="sp-body">
        <div class="sp-sec">游戏模式</div>
        <div id="modeBtns" class="sp-modes"></div>

        <div class="sp-sec">外观 / 隐身</div>
        <label class="sp-row"><span>透明度 <i id="lblOpacity"></i></span><input type="range" id="optOpacity" min="0.1" max="1" step="0.05"></label>
        <label class="sp-row"><span>窗口置顶</span><input type="checkbox" id="optAOT"></label>
        <label class="sp-row"><span>鼠标穿透</span><input type="checkbox" id="optClickThrough"></label>
        <label class="sp-row"><span>失焦自动暂停</span><input type="checkbox" id="optAutoPause"></label>
        <label class="sp-row"><span>失焦自动隐藏</span><input type="checkbox" id="optAutoHide"></label>
        <label class="sp-row"><span>窗口标题</span><input type="text" id="optTitle" maxlength="60"></label>
        <button class="sp-btn" id="optMini">切换 Mini 模式</button>

        <div class="sp-sec">主题 / 音效</div>
        <label class="sp-row"><span>配色</span><select id="optTheme"></select></label>
        <label class="sp-row"><span>音效</span><input type="checkbox" id="optSound"></label>

        <div class="sp-sec">手感</div>
        <label class="sp-row"><span>DAS <i id="lblDas"></i></span><input type="range" id="optDas" min="0" max="300" step="5"></label>
        <label class="sp-row"><span>ARR <i id="lblArr"></i></span><input type="range" id="optArr" min="0" max="80" step="2"></label>
        <label class="sp-row"><span>软降 <i id="lblSoft"></i></span><input type="range" id="optSoft" min="5" max="100" step="5"></label>
        <label class="sp-row"><span>锁定延迟 <i id="lblLock"></i></span><input type="range" id="optLock" min="0" max="900" step="50"></label>

        <div class="sp-sec">键位（点「重绑」后按目标键）</div>
        <div id="keybindList"></div>

        <div class="sp-sec">全局热键（如 Control+Alt+B）</div>
        <label class="sp-row"><span>老板键</span><input type="text" id="hkBoss"></label>
        <label class="sp-row"><span>显示/隐藏</span><input type="text" id="hkShow"></label>
        <label class="sp-row"><span>鼠标穿透</span><input type="text" id="hkClick"></label>
        <label class="sp-row"><span>Mini</span><input type="text" id="hkMini"></label>
        <label class="sp-row"><span>摸鱼瞬间消失</span><input type="text" id="hkVanish"></label>
        <button class="sp-btn" id="hkApply">应用全局热键</button>

        <div class="sp-sec">成就</div>
        <div id="achList"></div>

        <div class="sp-sec">导入 / 导出</div>
        <textarea id="ioText" rows="3" placeholder="设置 JSON（导出后可复制 / 粘贴后导入）"></textarea>
        <div class="sp-actions">
          <button class="sp-btn" id="ioExport">导出</button>
          <button class="sp-btn" id="ioImport">导入</button>
          <button class="sp-btn" id="ioReset">恢复默认</button>
        </div>
      </div>
    </div>
  </div>

  <script src="ai.js"></script>
  <script src="tetris.js"></script>
</body>
</html>
